variables:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US"
  LIB_NAME: "pupilidlib"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository"
  SECURE_LOG_LEVEL: "debug"
  SAST_JAVA_VERSION: 11
  SECRET_DETECTION_EXCLUDED_PATHS: ".gradle,gradle,.m2"

include:
  - template: Dependency-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Secret-Detection.gitlab-ci.yml

default:
  image: maven:3.6-jdk-11
  tags:
    - docker

stages:
  - assemble
  - test
  - package
  - release

cache:
  paths:
    - ".gradle/wrapper"
    - ".gradle/caches"
    - ".m2/repository"

assembleAndroid:
  stage: assemble
  image: gitlab.iaik.tugraz.at:5050/oe-gv-at/meta/ci/androidsdk31:latest
  except:
    - tags
  script: |
    ./gradlew --continue clean test
  artifacts:
    when: always
    reports:
      junit: "pupilidlib/build/test-results/testDebugUnitTest/TEST-*.xml"

assembleJdk11:
  stage: assemble
  except:
    - tags
  script: |
    ./gradlew --continue clean jvmTest
  artifacts:
    when: always
    reports:
      junit: "pupilidlib/build/test-results/jvmTest/TEST-*.xml"

assembleIos:
  stage: assemble
  allow_failure: true
  except:
    - tags
  tags:
    - ios
  script: |
    ./gradlew --continue clean iosX64Test
  artifacts:
    when: always
    reports:
      junit: "pupilidlib/build/test-results/iosX64Test/TEST-*.xml"

publish:
  stage: package
  except:
    - tags
  only:
    - master
    - development
    - /^release.*$/
  script: |
    export VERSION=$(grep artifactVersion gradle.properties | sed "s/artifactVersion = //g")
    echo "Publishing version $VERSION for $LIB_NAME"
    ./gradlew --continue clean assemble publish
    echo "VERSION=$VERSION" >> variables.env
  artifacts:
    when: always
    reports:
      dotenv: variables.env

publishIos:
  stage: package
  except:
    - tags
  only:
    - master
    - development
    - /^release.*$/
  tags:
    - ios
  script: |
    export VERSION=$(grep artifactVersion gradle.properties | sed "s/artifactVersion = //g")
    echo "Publishing version $VERSION for $LIB_NAME"
    ./gradlew --continue assembleDebugXCFramework
    (cd "$LIB_NAME/build/XCFrameworks/debug/"; zip -r "$LIB_NAME.zip" "$LIB_NAME.xcframework")
    export CHECKSUM=$(shasum -a 256 "$LIB_NAME/build/XCFrameworks/debug/$LIB_NAME.zip" | cut -d' ' -f1)
    export PACKAGE_REMOTE_ZIP=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/$LIB_NAME/$VERSION/$LIB_NAME-$VERSION.zip
    curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$LIB_NAME/build/XCFrameworks/debug/$LIB_NAME.zip" "${PACKAGE_REMOTE_ZIP}"
    cd ..
    rm -rf swift-package-pupilid-kmm-lib
    git clone --branch remotebinary "https://gitlab-ci-token:${SWIFT_REPO_ACCESS_TOKEN}@gitlab.iaik.tugraz.at/wallet/swift-package-pupilid-kmm-lib.git"
    cd swift-package-pupilid-kmm-lib
    sed -i.bak "s|url: \".*\"|url: \"${PACKAGE_REMOTE_ZIP}\"|" Package.swift && rm Package.swift.bak
    sed -i.bak "s|checksum: \".*\"|checksum: \"${CHECKSUM}\"|" Package.swift && rm Package.swift.bak
    git add Package.swift
    git commit -m "Update framework from build ${CI_COMMIT_SHORT_SHA} v${VERSION}"
    git push
    cd ../pupilid-kmm-lib
    echo "VERSION=$VERSION" >> variables.env
  artifacts:
    when: always
    reports:
      dotenv: variables.env

publishSnapshot:
  stage: package
  except:
    - tags
  when: manual
  script: |
    export VERSION=$(grep artifactVersion gradle.properties | sed "s/artifactVersion = //g")
    echo "Publishing version $VERSION for $LIB_NAME"
    ./gradlew --continue clean assemble publish
    echo "VERSION=$VERSION" >> variables.env
  artifacts:
    when: always
    reports:
      dotenv: variables.env

publishSnapshotIos:
  stage: package
  except:
    - tags
  when: manual
  tags:
    - ios
  script: |
    export VERSION=$(grep artifactVersion gradle.properties | sed "s/artifactVersion = //g")
    echo "Publishing version $VERSION for $LIB_NAME"
    ./gradlew --continue assembleDebugXCFramework
    (cd "$LIB_NAME/build/XCFrameworks/debug/"; zip -r "$LIB_NAME.zip" "$LIB_NAME.xcframework")
    export CHECKSUM=$(shasum -a 256 "$LIB_NAME/build/XCFrameworks/debug/$LIB_NAME.zip" | cut -d' ' -f1)
    export PACKAGE_REMOTE_ZIP=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/$LIB_NAME/$VERSION/$LIB_NAME-$VERSION.zip
    curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$LIB_NAME/build/XCFrameworks/debug/$LIB_NAME.zip" "${PACKAGE_REMOTE_ZIP}"
    cd ..
    rm -rf swift-package-pupilid-kmm-lib
    git clone --branch remotebinary "https://gitlab-ci-token:${SWIFT_REPO_ACCESS_TOKEN}@gitlab.iaik.tugraz.at/wallet/swift-package-pupilid-kmm-lib.git"
    cd swift-package-pupilid-kmm-lib
    sed -i.bak "s|url: \".*\"|url: \"${PACKAGE_REMOTE_ZIP}\"|" Package.swift && rm Package.swift.bak
    sed -i.bak "s|checksum: \".*\"|checksum: \"${CHECKSUM}\"|" Package.swift && rm Package.swift.bak
    git add Package.swift
    git commit -m "Update framework from build ${CI_COMMIT_SHORT_SHA}"
    git push
    cd ../pupilid-kmm-lib
    echo "VERSION=$VERSION" >> variables.env
  artifacts:
    when: always
    reports:
      dotenv: variables.env

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: publish
      artifacts: true
  when: manual
  only:
    - master
    - /^release.*$/
  script: |
    echo "Releasing version $VERSION of $LIB_NAME"
    release-cli create --name "$VERSION" --tag-name "v$VERSION" --ref "$CI_COMMIT_SHA" --description "$(cat README.md)" \
        --assets-link "{\"name\":\"$LIB_NAME-$VERSION.pom\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven/at/asitplus/wallet/$LIB_NAME/$VERSION/$LIB_NAME-$VERSION.pom\"}" \
        --assets-link "{\"name\":\"$LIB_NAME-$VERSION.jar\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven/at/asitplus/wallet/$LIB_NAME/$VERSION/$LIB_NAME-$VERSION.jar\"}" \
        --assets-link "{\"name\":\"$LIB_NAME-$VERSION.xcframework\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/$LIB_NAME/$VERSION/$LIB_NAME-$VERSION.zip\"}"
